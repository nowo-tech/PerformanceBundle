# UiKit page contract (REQ-UI-003): one host layout and one theme for every bundle page. The demo admin layout extends
# base.html.twig, which is UiKit's own admin layout (REQ-DEMO-014: UiKit default theme, no CSS framework, no CDN).
nowo_ui_kit:
    css_framework: custom
    icon_set: svg_inline
    layouts:
        admin: 'layouts/admin.html.twig'
