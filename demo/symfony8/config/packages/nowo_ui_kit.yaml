# UiKit page contract (REQ-UI-003): one host layout and one theme for every bundle page. The demo platform shell
# (templates/base.html.twig) is the admin and guest layout (REQ-DEMO-014: UiKit default theme, no CSS framework, no CDN).
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: svg_inline
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
