# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.0, 8.1 (+ PHPStan).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master, 3.x]
  pull_request:
    branches: [main, master, 3.x]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          # Whole history (REQ-GIT-001): Claude trailers before .scripts/claude-coauthor-baseline are grandfathered by the script.
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    # Never skipped at job level (required matrix contexts). Light mode: only PHP 8.5 - Symfony 8.1 does the work.
    needs: changes
    if: ${{ !cancelled() }}
    services:
      mysql:
        image: ${{ (needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1')) && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: performance_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword" --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: ${{ (needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1')) && 'postgres:15' || '' }}
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: performance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
    # The table-command database tests (tests/Integration/Command) run on MySQL, PostgreSQL and SQLite (REQ-TEST-003).
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/performance_test?serverVersion=8.0
      DATABASE_URL_PG: postgresql://postgres:password@127.0.0.1:5432/performance_test?serverVersion=15


    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['7.4', '8.0', '8.1']
        exclude:
          # doctrine/doctrine-bundle 3.x (required for Symfony 8) needs PHP ^8.4
          - php: '8.2'
            symfony: '8.0'
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.0'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo_mysql, pdo_pgsql, yaml
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          SYMFONY="${{ matrix.symfony }}"
          # Pin browser-kit + dom-crawler to the matrix Symfony: they are require-dev with ^7||^8 and could
          # otherwise stay on 8.x while http-kernel is 7.x, breaking HttpKernelBrowser::doRequest vs AbstractBrowser.
          # var-exporter must match the matrix Symfony major: ORM 3.6+ needs ProxyHelper::generateLazyGhost when native
          # lazy objects are off; that method was removed in symfony/var-exporter 8.x, so a 7.x stack must not pull 8.x here.
          # Pin every Symfony component used by the bundle (and symfony/console, which is only transitive): otherwise the
          # lock can keep mismatched Symfony majors across packages.
          # Symfony 8 needs doctrine/doctrine-bundle ^3.2 (PHP ^8.4); Symfony 7 uses ^2.18.
          composer require \
            symfony/config:^${SYMFONY} \
            symfony/console:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/stopwatch:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/var-exporter:^${SYMFONY} \
            --no-interaction --no-update
          composer require --dev \
            symfony/browser-kit:^${SYMFONY} \
            symfony/dom-crawler:^${SYMFONY} \
            symfony/http-client:^${SYMFONY} \
            symfony/mailer:^${SYMFONY} \
            symfony/mime:^${SYMFONY} \
            --no-interaction --no-update
          if [[ "${SYMFONY}" == 8.* ]]; then
            composer require doctrine/doctrine-bundle:^3.2 --no-interaction --no-update
          else
            composer require doctrine/doctrine-bundle:^2.18 --no-interaction --no-update
          fi
          # Quote 'symfony/*' so the shell never glob-expands it (with nullglob, symfony/* can vanish and Composer would
          # skip all Symfony packages — leaving e.g. console 7.x with yaml 8.x → fatal Command::configure(): void).
          # Full update reconciles require-dev (php-cs-fixer, rector, …) with the pinned Symfony major.
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        if: env.HEAVY == 'true'
        run: composer audit --locked


      - name: Validate translation YAML files
        if: env.HEAVY == 'true'
        run: php scripts/validate-translations-yaml.php src/Resources/translations

      - name: Run tests
        if: env.HEAVY == 'true'
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && matrix.php == '8.2' && matrix.symfony == '7.4'
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi

          echo "✅ All tests passed, validating coverage (minimum 100%)..."
          php scripts/check-coverage.php coverage.xml --min-percent=100

  # Real-database job (REQ-RUNTIME-003): the two-connection race tests (tests/Integration/Concurrency) and the
  # table-command database tests on MySQL 8.4, MariaDB 11.4 and PostgreSQL 16, on DBAL 4 (composer.json: ^4.0).
  # PERF_REQUIRE_DATABASES turns a missing or unreachable database into a failure instead of a skip.
  databases-matrix:
    name: Databases (${{ matrix.db }})
    runs-on: ubuntu-latest
    # Never skipped at job level (matrix contexts). Light mode: every cell passes after one echo step, no service image is pulled.
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql-8.4', 'mariadb-11.4', 'postgresql-16']
        include:
          - db: 'mysql-8.4'
            image: 'mysql:8.4'
            port: 3306
            health: '--health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword" --health-interval=5s --health-timeout=3s --health-retries=30'
            require: 'mysql'
            urls: 'DATABASE_URL=mysql://root:password@127.0.0.1:3306/performance_test?serverVersion=8.4'
          - db: 'mariadb-11.4'
            image: 'mariadb:11.4'
            port: 3306
            health: '--health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=30'
            require: 'mariadb'
            # DATABASE_URL too: the table-command database tests read it for their MySQL-family cases.
            urls: 'DATABASE_URL_MARIADB=mysql://root:password@127.0.0.1:3306/performance_test?serverVersion=11.4.2-MariaDB DATABASE_URL=mysql://root:password@127.0.0.1:3306/performance_test?serverVersion=11.4.2-MariaDB'
          - db: 'postgresql-16'
            image: 'postgres:16'
            port: 5432
            health: '--health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=30'
            require: 'postgresql'
            urls: 'DATABASE_URL_PG=postgresql://postgres:password@127.0.0.1:5432/performance_test?serverVersion=16'
    services:
      db:
        image: ${{ needs.changes.outputs.mode != 'light' && matrix.image || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: performance_test
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: performance_test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: performance_test
        ports: ['${{ matrix.port }}:${{ matrix.port }}']
        options: ${{ matrix.health }}
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      PERF_REQUIRE_DATABASES: ${{ matrix.require }}

    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: env.HEAVY == 'true'
        run: |
          composer config platform.php "8.4.99"
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer show doctrine/dbal | grep -E '^versions'

      - name: Race and database tests
        if: env.HEAVY == 'true'
        run: env ${{ matrix.urls }} vendor/bin/phpunit --no-coverage tests/Integration/Concurrency tests/Integration/Command

  # Single required check (REQ-GIT-002) for the whole real-database matrix.
  databases:
    name: Databases
    runs-on: ubuntu-latest
    needs: databases-matrix
    if: always()
    steps:
      - name: Every database job passed
        run: |
          if [ "${{ needs.databases-matrix.result }}" != "success" ]; then
            echo "Databases matrix result: ${{ needs.databases-matrix.result }}"
            exit 1
          fi

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: composer phpstan

      # Twig coding standard (twig-cs-fixer, .twig-cs-fixer.php): fails on any lint error.
      - name: Twig lint
        run: composer twig:lint

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, which branch protection accepts).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: performance_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword" --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: performance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
    # The table-command database tests (tests/Integration/Command) run on MySQL, PostgreSQL and SQLite (REQ-TEST-003).
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/performance_test?serverVersion=8.0
      DATABASE_URL_PG: postgresql://postgres:password@127.0.0.1:5432/performance_test?serverVersion=15


    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql, pdo_pgsql
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require \
            symfony/config:^7.4 \
            symfony/console:^7.4 \
            symfony/dependency-injection:^7.4 \
            symfony/framework-bundle:^7.4 \
            symfony/form:^7.4 \
            symfony/http-kernel:^7.4 \
            symfony/yaml:^7.4 \
            symfony/security-bundle:^7.4 \
            symfony/stopwatch:^7.4 \
            symfony/translation:^7.4 \
            symfony/twig-bundle:^7.4 \
            symfony/var-exporter:^7.4 \
            doctrine/doctrine-bundle:^2.18 \
            --no-interaction --no-update
          composer require --dev \
            symfony/browser-kit:^7.4 \
            symfony/dom-crawler:^7.4 \
            symfony/http-client:^7.4 \
            symfony/mailer:^7.4 \
            symfony/mime:^7.4 \
            --no-interaction --no-update
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage (minimum 100%)
        run: |
          echo "📊 Validating coverage (minimum 100%)..."
          php scripts/check-coverage.php coverage.xml --min-percent=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

# Maintainer: Héctor Franco Aceituno (@HecFranco)
# Organization: nowo-tech (https://github.com/nowo-tech)

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, which branch protection accepts).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql, pdo_pgsql
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/performance-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql, pdo_pgsql, yaml
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
