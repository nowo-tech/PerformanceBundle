# Loaded only when symfony/ux-twig-component is installed (see PerformanceExtension).
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\PerformanceBundle\Twig\Component\:
        resource: '../../Twig/Component/*'
        public: true

  # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
  Nowo\PerformanceBundle\Form\:
    resource: '../../Form/'
    exclude: '../../Form/DataTransformer/'
    tags: ['form.type']
