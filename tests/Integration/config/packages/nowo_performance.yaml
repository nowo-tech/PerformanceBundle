nowo_performance:
    enabled: true
    environments: [test]
    connection: default
    table_name: routes_data
    track_queries: true
    track_request_time: true
    enable_access_records: true
    check_table_status: true
    ignore_routes: []
    web_ui:
        enabled: true
        path_prefix: /performance
    dashboard:
        enable_record_management: true
        enable_review_system: true
    # Open test dashboard: an empty role list denies, so the functional tests opt in explicitly.
    security:
        access_roles: []
        allow_unauthenticated: true
